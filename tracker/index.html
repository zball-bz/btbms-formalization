<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTBMS Formalization Board</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2533;--muted:#5d6b7e;--line:#dde3ea;--accent:#2c5fd1;
  --todo:#8792a2;--doing:#2c5fd1;--blocked:#c0392b;--review:#8a4fd0;--done:#1f8a55;
  --fatal:#c0392b;--repairable:#b7791f;--exposition:#5d6b7e;--unknown:#8792a2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161c;--card:#1b222b;--ink:#e4e9f0;--muted:#9aa6b6;--line:#2c3540;--accent:#7aa2ff;--todo:#7d8898;--doing:#7aa2ff;--review:#b48cf0;--done:#4cc489;--blocked:#ff7a6b;--fatal:#ff7a6b;--repairable:#e0a84a}}
:root[data-theme=dark]{--bg:#12161c;--card:#1b222b;--ink:#e4e9f0;--muted:#9aa6b6;--line:#2c3540;--accent:#7aa2ff;--todo:#7d8898;--doing:#7aa2ff;--review:#b48cf0;--done:#4cc489;--blocked:#ff7a6b;--fatal:#ff7a6b;--repairable:#e0a84a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1400px;margin:auto;padding:24px 16px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.phases{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.phase{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12px}
.phase.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 18px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric b{display:block;font-size:22px}.metric span{color:var(--muted);font-size:12px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;font:inherit}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.card .id{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:0 7px;margin:4px 4px 0 0;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.sev{font-weight:600}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px}
.wrap{overflow-x:auto}
@media (max-width:700px){.board{grid-template-columns:1fr}}
</style>
</head>

646-686; §7.1 txt:1045-1065; §8.5 txt:1474", "summary": "Admitted records (§4) and the packet class quantified in S_n (§7) are not exact predicates; closure of the class under the §8.5 constructions is not checkable as written", "found_by": ["claude", "codex"], "refs": ["claude C-05", "codex X-04"], "detail": "Records need explicit occurrence maps, actual scan indices, retained marked-entry/pre-entry equations, repair lists with surviving-role injections. Packets need a fixed grammar for auxiliary diagrams and labels, closed under factorization, joint cap, joint repair, the §7.3 extension and the readmission in §8.5 Cases 2-3. Boundary instance (codex): in L_2 a special step at parameter 1 replaces the marked outer entry, so \"confined\" must require survival of the marked occurrence. Neither reviewer found a counterexample to the intended statement. Codex T-017: repair partial; closure providers BP-03..BP-05, BP-08, BP-09 need correction.", "fix": "Define records and packets as explicit finite structures (constructors with occurrence/projection fields) and prove the closure lemmas before stating S_n in Lean.", "fix_by": "claude", "repair": "blueprint D4.1a SrcRecord/Admitted, D7.2a SourcePacket.Valid, D7.2b ScanSetup.Valid; SStrict quantifies over them"}, {"id": "G-004", "status": "closed", "severity": "exposition", "loc": "§5.2 txt:864-866", "summary": "\"The hull contains the whole J_b\" must mean J_b ∈ H, not J_b ⊆ H", "found_by": ["codex"], "confirmed_by": ["claude"], "refs": ["codex X-05"], "detail": "J_b ⊆ H would give H ∩ J_b = J_b ≠ J_a, contradicting (10). Claude checked the one-line argument (non-blind).", "fix": "Write J_b ∈ H, then relativized Tarski-Vaught.", "fix_by": "claude", "repair": "blueprint D5.7a (J route only); does not arise under P-U4-1", "fix_checked_by": "codex"}, {"id": "G-005", "status": "closed", "severity": "exposition", "loc": "§10 txt:1516-1534", "summary": "The \"accompanying Python programs\" of §10 are not supplied", "found_by": ["codex"], "confirmed_by": ["claude"], "refs": ["codex X-06"], "detail": "Only the PDF was provided. §10 is not used as evidence by either review.", "fix": "Ask the author for the programs, or ignore §10.", "fix_by": "claude", "repair": "§10 is used nowhere in the blueprint", "fix_checked_by": "codex"}, {"id": "G-006", "status": "closed", "severity": "repairable", "loc": "§2 txt:194-236", "summary": "Path nesting, barrier and capping proofs do not state their induction predicates and orders across height scopes", "found_by": ["claude"], "refs": ["claude C-06", "codex CROSSCHECK-1 Q2"], "detail": "Codex (blind): the stated numerical orders suffice, but the paper does not print the needed predicates. Barrier needs a joint induction on (c,k) of C_e (cut paths reaching a have query < D_e) and R_e (return bounds). Reverse capping needs actual A together with actual return bounds, plus a first-divergence argument: the first decorated edge differing from the actual scan is at a capped column a reached by an actual path, so C_e gives W < B_a(v) <= B_a(u*), and the scan stops before the capped key. A proof carrying only \"earlier entry A holds\" would leave a gap. Codex verdict: no unrepaired mathematical gap. Claude checked each step of the repair.", "fix": "Write the joint predicates C_e/R_e, the localized pre-entry-cut barrier and the first-divergence argument as explicit lemmas (codex-crosscheck-1.md, Q2).", "confirmed_by": ["codex"], "fix_by": "codex", "fix_checked_by": "claude"}, {"id": "G-007", "status": "closed", "severity": "repairable", "loc": "lean/BTBMS/Expansion.lean (statement port)", "summary": "Lean expand returned none where BTBM.FS returns a forest, on raw non-V/I inputs whose root lies in the stopping entry's height", "found_by": ["codex"], "confirmed_by": ["claude"], "fix_by": "claude", "refs": ["codex-statement-review.md §2"], "detail": "Not a paper gap: a defect in Claude's Lean port, outside the standard domain. E.g. [[],[(2,[[]])]] at n=0: reference ∅ stantInfo.type of mainTheorem/paperTheorem syntactically with MainTheorem.{u}/PaperTheorem.{u}, rejects axiom declarations in BTBMS and axioms outside {propext, Classical.choice, Quot.sound, sorryAx}; check.sh --final also rejects sorryAx. lock.py hashes every package resolved from lake-manifest.json and the toolchain bin/ and src/. lean-status.json carries an input fingerprint; refresh.py ignores stale or failed status; extra axioms are classified, opaque bodies scanned. Follow-up: scripts/lean_status.py publishes atomically, writes an in-progress record first, runs build, LockCheck audit and extraction, validates the JSON, re-checks the fingerprint; refresh.py requires state ok, build_ok, audit_ok, a matching fingerprint and an intact lock. Symlinks in any hashed tree, including lean/, are refused. Follow-up 2: only a hashed tree root's own .lake/.git are skipped; nested ones are hashed. Row and axiom-item types validated. Follow-up 3: LockCheck rejects any module in the import closure with a non-identifier name component, so every source is read from its standard path inside a hashed tree.", "fix_by": "claude", "fix_checked_by": "codex"}, {"id": "G-009", "status": "confirmed", "severity": "unknown", "loc": "§3 txt:553-560", "summary": "Cofinality, ordinary step: the response at a previous-phase root (r < ρ < s_φ) is asserted without the invariant that relates V = κ_φ W to the old terminal queries along the low-head detour", "found_by": ["claude"], "confirmed_by": ["codex"], "refs": ["blueprint/INTEGRATION.md §2.2", "codex-blueprint-review.md BP-07"], "detail": "Found while writing the blueprint (node T3.8lo). Statement passed 647 bounded caps with r < ρ < s_φ; the invariant for proof step 3 is not written."}, {"id": "G-010", "status": "confirmed", "severity": "unknown", "loc": "§3 txt:520-541", "summary": "Cofinality, projection of the final A-test: needs a decorated-key variant of head_path whose hypotheses the paper does not fix", "found_by": ["claude"], "confi
