<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTBMS Formalization Board</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2533;--muted:#5d6b7e;--line:#dde3ea;--accent:#2c5fd1;
  --todo:#8792a2;--doing:#2c5fd1;--blocked:#c0392b;--review:#8a4fd0;--done:#1f8a55;
  --fatal:#c0392b;--repairable:#b7791f;--exposition:#5d6b7e;--unknown:#8792a2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161c;--card:#1b222b;--ink:#e4e9f0;--muted:#9aa6b6;--line:#2c3540;--accent:#7aa2ff;--todo:#7d8898;--doing:#7aa2ff;--review:#b48cf0;--done:#4cc489;--blocked:#ff7a6b;--fatal:#ff7a6b;--repairable:#e0a84a}}
:root[data-theme=dark]{--bg:#12161c;--card:#1b222b;--ink:#e4e9f0;--muted:#9aa6b6;--line:#2c3540;--accent:#7aa2ff;--todo:#7d8898;--doing:#7aa2ff;--review:#b48cf0;--done:#4cc489;--blocked:#ff7a6b;--fatal:#ff7a6b;--repairable:#e0a84a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1400px;margin:auto;padding:24px 16px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.phases{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.phase{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12px}
.phase.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 18px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric b{display:block;font-size:22px}.metric span{color:var(--muted);font-size:12px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;font:inherit}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.card .id{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:0 7px;margin:4px 4px 0 0;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.sev{font-weight:600}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px}
.wrap{overflow-x:auto}
@media (max-width:700px){.board{grid-template-columns:1fr}}
</style>
</head>

      ds.sort((a,b) => order.indexOf(state(a)) - order.indexOf(state(b)) || a.module.localeCompare(b.module)).map(d =>
        `<tr><td class="mono">${esc(d.name)}</td><td>${esc(d.kind)}</td><td class="mono">${esc(d.module)}</td><td>${esc(state(d))}</td>
        <td class="mono small">${esc(d.axioms.join(', '))}</td></tr>`).join('')}</table></div>`;
  },
};
const tabs = document.getElementById('tabs');
function show(name) {
  [...tabs.children].forEach(b => b.setAttribute('aria-selected', b.textContent === name));
  document.getElementById('view').innerHTML = views[name]();
  try { localStorage.setItem('tab', name); } catch (e) {}
}
Object.keys(views).forEach(n => { const b = document.createElement('button'); b.textContent = n; b.setAttribute('role','tab'); b.onclick = () => show(n); tabs.appendChild(b); });
let start = 'Board'; try { start = localStorage.getItem('tab') || 'Board'; } catch (e) {}
show(views[start] ? start : 'Board');
</script>
</body>
</html>
